<title>LogBook 빈칸·점검·선례</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 네이비 크롬(상단 바 + 사이드 내비) 안에 흰 작업면 하나. 화면마다 본문 | 오른쪽 상세 열.
   LogBook 은 밝은 단일 테마(DESIGN.md — 다크 테마 없음)라 다크 블록 없이 모든 색을 명시한다. */
:root {
  color-scheme: light;
  --n-0:#FFFFFF; --n-25:#FAFCFF; --n-50:#F5F8FD; --n-100:#EEF2F8; --n-150:#E6EBF2;
  --n-200:#E0E5EC; --n-250:#D3D9E0; --n-300:#BDC3CA; --n-400:#90959C; --n-500:#686D74;
  --n-600:#4E5359; --n-700:#383C42; --n-800:#24282E; --n-900:#13171C;
  --navy-900:#002554; --navy-800:#0D315F; --navy-700:#1B3E6E; --navy-600:#2E507F; --on-navy:#FFFFFF;
  --on-navy-muted:#B9C9DE; --on-navy-subtle:#97A9C2; --on-navy-icon:#8A9DB8; --brand-mint:#6BE8C1;
  --brand:#002554; --brand-hover:#0B2F5E; --brand-subtle:#EDF3FB; --brand-muted:#D9E4F4; --brand-ring:#7F97B8;
  --ok:#007A30; --ok-bg:#EAF5EE; --wait:#A34A07; --wait-bg:#FDF3E7; --err:#B42318; --err-bg:#FDEEEC; --err-line:#F4C7C1;
  --hl:#E8590C; --viewer:#0E1A2B;
  --p-shape:#002554; --p-size:#3D6AA8; --p-scale:#6F93C6; --p-mix:#2E8A7A; --p-sec:#7CC2B2; --p-tag:#B9A26A;
  --font-sans:"Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--navy-900); color: var(--n-900); font-family: var(--font-sans); font-size: 13px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; }
button, input, select { font: inherit; color: inherit; }
::selection { background: var(--brand-muted); color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 1px; }
* { scrollbar-width: thin; scrollbar-color: var(--n-300) transparent; box-sizing: border-box; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums slashed-zero; }

.app { height: 100%; display: grid; grid-template-rows: 48px minmax(0, 1fr); }
.topbar { background: var(--navy-900); color: var(--on-navy); display: flex; align-items: center; gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wordmark { font-weight: 600; font-size: 15px; white-space: nowrap; }
.wordmark b { color: var(--brand-mint); font-weight: 600; }
.top-search { flex: 1; max-width: 460px; height: 32px; border-radius: 6px; background: var(--n-0); color: var(--n-500);
  display: flex; align-items: center; padding-inline: 12px; font-size: 12.5px; justify-content: space-between; }
.top-search kbd { font-family: var(--font-mono); font-size: 11px; background: var(--n-50); color: var(--n-600); border-radius: 4px; padding: 1px 6px; }
.top-user { margin-left: auto; color: var(--on-navy-muted); font-size: 12.5px; white-space: nowrap; }
.mock-flag { font-size: 12px; color: var(--navy-900); background: var(--brand-mint); border-radius: 4px; padding: 2px 8px; font-weight: 600; white-space: nowrap; }

.body { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
.sidenav { background: var(--navy-900); padding-block: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px;
  display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.nav-sec { color: var(--on-navy-subtle); font-size: 12px; font-weight: 500; padding: 12px 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 9px; height: 32px; padding-inline: 10px; border-radius: 6px; color: var(--on-navy-muted);
  font-size: 13px; font-weight: 500; text-decoration: none; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
.nav-item svg { width: 16px; height: 16px; flex: none; stroke: var(--on-navy-icon); fill: none; stroke-width: 1.7; }
.nav-item.old { cursor: default; opacity: .62; }
.nav-item.new:hover { background: var(--navy-800); color: var(--on-navy); }
.nav-item.new[aria-current="page"] { background: var(--navy-700); color: var(--on-navy); }
.nav-item.new[aria-current="page"] svg { stroke: var(--on-navy); }
.nav-item .tag { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--on-navy-subtle); }
.nav-foot { margin-top: auto; border-top: 1px solid var(--navy-700); padding: 12px 10px 4px; color: var(--on-navy-subtle); font-size: 11.5px; line-height: 1.6; }

.main { background: var(--n-0); border-top-left-radius: 12px; min-height: 0; overflow: auto; }
.page { max-width: 1440px; margin: 0 auto; padding-block: 22px 40px; padding-inline: 28px; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--n-200); margin-bottom: 16px; }
.ph h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.018em; margin: 0; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--n-600); font-size: 13.5px; max-width: 72ch; }
.sample { font-size: 12px; color: var(--wait); background: var(--wait-bg); border-radius: 5px; padding: 4px 10px; white-space: nowrap; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.panel { border: 1px solid var(--n-200); border-radius: 8px; background: var(--n-0); }
.side { position: sticky; top: 16px; max-height: calc(100vh - 100px); overflow: auto; }
.sec-t { font-size: 13px; font-weight: 600; color: var(--n-800); margin: 0 0 8px; }
.muted { color: var(--n-500); }
.small { font-size: 12px; }

.btn { height: 28px; padding-inline: 10px; border-radius: 6px; border: 1px solid var(--n-250); background: var(--n-0); cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--n-50); border-color: var(--n-300); }
.btn.primary { background: var(--brand); color: var(--on-navy); border-color: var(--brand); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--brand); }
.btn.ghost:hover { background: var(--brand-subtle); }
.seg { display: inline-flex; background: var(--n-100); border-radius: 7px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; height: 26px; padding-inline: 10px; border-radius: 5px; cursor: pointer; font-size: 12.5px; color: var(--n-600); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--n-0); color: var(--n-900); box-shadow: 0 1px 2px rgb(19 23 30 / .12); font-weight: 500; }
.chip { display: inline-flex; align-items: center; height: 20px; padding-inline: 6px; border-radius: 4px; background: var(--brand); color: var(--on-navy);
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.proj { background: var(--n-100); color: var(--n-800); font-family: var(--font-sans); }
.tagc { display: inline-flex; align-items: center; height: 20px; padding-inline: 7px; border-radius: 4px; background: var(--n-100); color: var(--n-700); font-size: 12px; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding-inline: 7px; border-radius: 10px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.fail { color: var(--err); background: var(--err-bg); }
.pill.none { color: var(--n-600); background: var(--n-100); }
.pill.warn { color: var(--wait); background: var(--wait-bg); }
.pill.info { color: var(--navy-700); background: var(--brand-subtle); }
.kb { display: inline-flex; align-items: center; height: 18px; padding-inline: 5px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.kb.bdf { background: #E8EEF9; color: #1F3F7A; } .kb.pdf { background: #FBEAEA; color: #9B1C1C; } .kb.ppt { background: #FCEFE3; color: #92400E; }
.idl { font-family: var(--font-mono); font-size: 12px; color: var(--n-600); }

/* ---------- 빈칸 지도 ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-end; margin-bottom: 12px; }
.tb-g { display: flex; flex-direction: column; gap: 4px; }
.tb-g > span { font-size: 12px; color: var(--n-600); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.legend .lt-h { font-size: 12px; color: var(--n-600); margin-right: 4px; }
.lg { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 6px; border-radius: 6px; border: 1px solid var(--n-200); background: var(--n-0); cursor: pointer; font-size: 12.5px; }
.lg:hover { background: var(--n-50); }
.lg[aria-pressed="true"] { border-color: var(--n-900); background: var(--n-50); }
.lg b { font-family: var(--font-mono); font-weight: 500; }
.lg em { font-style: normal; color: var(--n-500); font-size: 12px; }
.sw { width: 22px; height: 16px; border-radius: 3px; position: relative; flex: none; }
.gridwrap { overflow: auto; border: 1px solid var(--n-200); border-radius: 8px; max-height: min(640px, calc(100vh - 290px)); min-height: 320px; }
table.cov { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.cov th, table.cov td { padding: 0; }
table.cov thead th { position: sticky; top: 0; background: var(--n-50); z-index: 2; border-bottom: 1px solid var(--n-200); vertical-align: bottom; }
table.cov thead th.zh { width: 45px; min-width: 45px; max-width: 45px; padding: 8px 1px 6px; font-weight: 500; color: var(--n-700); font-size: 12px; line-height: 1.3; text-align: center; }
.zbar { height: 3px; background: var(--n-150); border-radius: 2px; margin: 6px 7px 0; overflow: hidden; }
.zbar i { display: block; height: 100%; background: var(--n-400); }
.zn { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--n-600); margin-top: 2px; }
table.cov th.rh { position: sticky; left: 0; background: var(--n-0); z-index: 1; text-align: left; min-width: 138px; padding: 0 8px 0 10px; border-right: 1px solid var(--n-200); font-weight: 400; }
table.cov thead th.rh { z-index: 3; background: var(--n-50); color: var(--n-600); font-size: 12px; font-weight: 500; padding-bottom: 8px; }
.rhin { display: flex; align-items: center; gap: 7px; height: 34px; }
.rhin .st { color: var(--n-600); font-size: 12px; }
.rcov { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--n-600); }
table.cov tbody tr:hover th.rh, table.cov tbody tr.rsel th.rh { background: var(--n-50); }
table.cov td { text-align: center; border-bottom: 1px solid var(--n-100); }
table.cov thead th.zsel { background: var(--n-100); color: var(--n-900); }
.cell { width: 37px; height: 26px; margin: 4px; border-radius: 4px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 12px; cursor: pointer; position: relative; background: none; padding: 0; transition: box-shadow .15s cubic-bezier(.2,0,0,1), opacity .15s; }
.cell:hover { box-shadow: 0 0 0 2px var(--brand-ring); }
.cell:focus-visible { outline: 2px solid var(--n-900); outline-offset: 2px; }
.c-full { background: var(--brand); color: var(--on-navy); }
.c-noreport { background: var(--brand-muted); color: var(--brand); border-color: #9FB4D3; }
.c-noreport::after { content: ""; position: absolute; right: -1px; top: -1px; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--n-0) transparent transparent; }
.c-nomodel { background: var(--n-0); color: var(--brand); border: 1.5px dashed var(--navy-600); }
.c-fail { background: var(--err-bg); color: var(--err); border-color: var(--err-line); }
.c-fail::before { content: ""; position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--err); }
.c-empty { background: var(--n-0); border: 1px dashed var(--n-300); color: var(--n-500); }
.c-empty.expect { border: 1.5px solid var(--err); background: var(--err-bg); color: var(--err); font-weight: 600; }
.c-na { background: repeating-linear-gradient(135deg, var(--n-100) 0 4px, var(--n-50) 4px 8px); border-color: var(--n-150); cursor: default; }
.c-na:hover { box-shadow: none; }
.c-sel { outline: 2px solid var(--n-900); outline-offset: 2px; }
.dim .cell:not(.on) { opacity: .14; }
.dim .cell.c-empty.on { border: 1.5px solid var(--n-700); background: var(--n-50); }
.gridnote { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--n-600); margin-top: 6px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--n-900); color: var(--n-0); font-size: 12.5px; line-height: 1.55; padding: 8px 11px; border-radius: 6px; max-width: 300px; box-shadow: 0 6px 20px rgb(19 23 30 / .25); }
.tip b { color: var(--n-0); font-weight: 600; }
.lists { margin-top: 22px; }
.lists-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.scope { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand); font-size: 12.5px; }
.scope button { border: 0; background: none; cursor: pointer; color: var(--brand); width: 22px; height: 22px; border-radius: 11px; font-size: 14px; line-height: 1; }
.scope button:hover { background: var(--brand-muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--n-200); margin-bottom: 0; flex-wrap: wrap; }
.tabs button { border: 0; background: none; height: 36px; padding-inline: 12px; cursor: pointer; font-size: 13px; color: var(--n-600); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--n-900); border-bottom-color: var(--n-900); font-weight: 500; }
.tabs .cnt { font-family: var(--font-mono); font-size: 12px; color: var(--n-600); margin-left: 4px; }
.tabnote { font-size: 12.5px; color: var(--n-600); padding: 10px 2px; }
table.lt { width: 100%; border-collapse: collapse; font-size: 13px; }
table.lt th { text-align: left; font-size: 12px; font-weight: 500; color: var(--n-600); background: var(--n-50); height: 34px; padding: 0 10px; border-bottom: 1px solid var(--n-200); white-space: nowrap; position: sticky; top: 0; }
table.lt td { height: 42px; padding: 4px 10px; border-bottom: 1px solid var(--n-100); }
table.lt td.nw { white-space: nowrap; }
table.lt tr:hover td { background: var(--n-50); }
.ltwrap { border: 1px solid var(--n-200); border-radius: 8px; overflow: auto; }
.more { padding: 10px; text-align: center; font-size: 12.5px; color: var(--n-600); border-top: 1px solid var(--n-100); }

.dp { padding: 16px; }
.dp h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dp .lead { font-size: 13px; color: var(--n-700); margin: 8px 0 14px; padding: 10px 12px; background: var(--n-50); border-radius: 6px; }
.erow { padding: 10px 0; border-top: 1px solid var(--n-100); }
.erow:first-of-type { border-top: 0; }
.erow .t { font-size: 13.5px; font-weight: 600; color: var(--n-900); }
.erow .m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; }
.todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 9px 4px; border-top: 1px solid var(--n-100); cursor: pointer; border-radius: 4px; }
.todo:hover { background: var(--n-50); }
.todo .w { font-size: 13px; color: var(--n-900); }
.todo .s { font-size: 12px; color: var(--n-600); }
.empty-note { padding: 28px 16px; color: var(--n-600); font-size: 13px; }
/* ---------- 모델 점검 ---------- */
.rules { width: 100%; border-collapse: collapse; font-size: 13px; }
.rules th { text-align: left; font-size: 12px; font-weight: 500; color: var(--n-600); background: var(--n-50); height: 34px; padding: 0 10px; border-bottom: 1px solid var(--n-200); white-space: nowrap; }
.rules td { height: 40px; padding: 4px 10px; border-bottom: 1px solid var(--n-100); }
.rules tr.rr { cursor: pointer; }
.rules tr.rr:hover td { background: var(--n-50); }
.rules tr.rr[aria-selected="true"] td { background: var(--brand-subtle); }
.rbar { display: inline-block; width: 90px; height: 6px; background: var(--n-150); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.rbar i { display: block; height: 100%; background: var(--navy-600); }
.ck-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.mlist { max-height: 760px; overflow: auto; }
.mrow { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-bottom: 1px solid var(--n-100); cursor: pointer; }
.mrow:hover { background: var(--n-50); }
.mrow[aria-selected="true"] { background: var(--brand-subtle); }
.mrow[aria-selected="true"] .t { color: var(--brand); }
.mrow .t { font-size: 13px; font-weight: 600; }
.mrow .m { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.ckitem { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--n-100); }
.ckitem:first-child { border-top: 0; }
.ckitem .s { font-size: 13.5px; color: var(--n-900); }
.ckitem .d { font-size: 12px; color: var(--n-500); margin-top: 2px; }
.ckitem[aria-current="true"] .s { color: var(--hl); }
.viewer { position: relative; background: var(--viewer); border-radius: 8px; overflow: hidden; }
.viewer canvas { display: block; width: 100%; height: 300px; }
.viewer .vcap { position: absolute; left: 12px; bottom: 10px; color: #C9D6EA; font-size: 12px; }
.viewer .vlg { position: absolute; right: 12px; top: 10px; color: #C9D6EA; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.viewer .vlg i { width: 9px; height: 9px; border-radius: 50%; background: var(--hl); display: inline-block; }
.peer { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--n-100); }
.peer:first-of-type { border-top: 0; }
.peer .nm { font-size: 12.5px; color: var(--n-700); }
.peer svg { width: 100%; height: 34px; display: block; }
.peer .sent { grid-column: 2; font-size: 12.5px; color: var(--n-700); }
.peer .sent.flag { color: var(--wait); font-weight: 500; }
.mockcard { border: 1px solid var(--n-200); border-radius: 8px; padding: 12px; background: var(--n-0); }
.mockcard .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ckbadge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; background: var(--wait-bg); color: var(--wait); font-size: 11.5px; font-weight: 600; cursor: pointer; border: 0; }
.ckbadge.info { background: var(--brand-subtle); color: var(--navy-700); }
.ckbadge.zero { background: var(--ok-bg); color: var(--ok); }

/* ---------- 비슷한 선례 ---------- */
.basebar { display: grid; grid-template-columns: 168px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 14px; border: 1px solid var(--n-200); border-radius: 8px; background: var(--n-0); }
.basebar.over { border-color: var(--brand); background: var(--brand-subtle); outline: 2px dashed var(--brand-ring); outline-offset: -6px; }
.basebar canvas { width: 168px; height: 104px; display: block; border-radius: 6px; background: var(--viewer); }
.bname { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bname b { font-size: 15px; font-weight: 600; }
.bfacts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 13px; color: var(--n-700); }
.bfacts .k { color: var(--n-600); margin-right: 5px; }
.bctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.bctl .lb { font-size: 12px; color: var(--n-600); }
.bact { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 176px; }
.bact .hint { font-size: 12px; color: var(--n-600); text-align: center; }
.exrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0 0; }
.exrow .lb { font-size: 12px; color: var(--n-600); margin-right: 2px; }

<script>

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261016);

const fmt = n => n.toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ROWS = [
  ['2981', 'VLCC'], ['3115', '컨테이너'], ['3204', 'LNGC'], ['3266', 'LNGC'], ['3321', 'FPSO'], ['3370', 'LNGC'], ['3412', '컨테이너'],

  .concat([

const ZONES = {

const ZONE_NAMES = Object.keys(ZONES);
const ZONE_POP = { '정반': .9, '블록': .75, '모듈': .55, '데크하우스': .35, '마스트': .45, '크레인 받침': .3, '계류': .55, '헬리데크': .15, '라싱 브리지': .3, '화물창': .4, '기관실': .25, '갑판 의장': .3 };

  'FSRU': { '정반': ['Truss'], '모듈': ['권상'], '계류': ['계류 강도'] },
  'LPGC': { '정반': ['Truss'], '블록': ['권상'], '계류': ['계류 강도'] },
  'PCTC': { '정반': ['Truss'], '블록': ['권상'], '데크하우스': ['권상'] },
};
const PEOPLE = ['김도윤', '이서준', '박지호', '최민재', '정하은', '강예린', '윤시우', '장태현', '임수빈', '한지민', '오세훈', '서유나'];
const SECTIONS = {
  frame: ['L100x100x10', 'L130x130x12', 'L150x90x12', 'H200x200x8x12', 'H300x300x10x15', 'H250x250x9x14', 'BOX200x200x10', 'PIPE114.3x6', 'T250x90x10x15'],
  plate: ['t8', 't10', 't12', 't14', 't16', 't20', 'FB150x12', 'FB200x15', 'L150x90x12', 'T300x100x11x16', 'L125x75x10'],
  module: ['H200x200x8x12', 'H300x300x10x15', 'H400x200x8x13', 'L100x100x10', 'PIPE165.2x7', 'BOX250x250x12', 't8', 't10', 't12', 'FB150x12'],
  mast: ['PIPE165.2x7', 'PIPE216.3x8', 'PIPE114.3x6', 'L100x100x10', 'L75x75x9', 'BOX200x200x10', 't10', 't12'],

const DIMS = { frame: [[16, 32], [7, 14], [1.4, 3.2]], plate: [[7, 20], [5, 14], [1.8, 5]], module: [[14, 34], [10, 24], [7, 18]], mast: [[2, 4], [2, 4], [9, 24]] };
const ELEMS = { frame: [700, 6000], plate: [4000, 48000], module: [3500, 36000], mast: [500, 3800] };
const MIX = { frame: [.9, .0, .07, .03], plate: [.22, .74, .03, .01], module: [.58, .36, .04, .02], mast: [.93, .03, .03, .01] };

}

const ENTRIES = [];
let eSeq = 1180;
function dateFor(row) {
  const y = 2023 + Math.min(3, Math.floor((1 - row.maturity) * 3.2 + R()));
  const mo = 1 + Math.floor(R() * (y === 2026 ? 9 : 12));
  return `${y}-${String(mo).padStart(2, '0')}`;

  for (const zone of ZONE_NAMES) {
    const p = Math.min(.95, ZONE_POP[zone] * (0.55 + row.maturity));

        by: pick(PEOPLE), date: dateFor(row), geom,
        secs, sol: hasModel ? (R() < .94 ? '101' : '103') : null,

}

const MODELS = ENTRIES.filter(e => e.hasModel);

    <div class="likeness"><div class="w ${s.total < .5 ? 'weak' : ''}">${likeWord(s.total)}</div><div class="n" title="유사도 점수(0~1)">${s.total.toFixed(2)}</div><div class="lbar"><i style="width:${Math.round(s.total * 100)}%"></i></div></div>
    ${grp && open ? `<div class="members">${r.list.map(x => `<div class="mem">${rowChip(x.e.row)}<span>${esc(shortTitle(x.e))} <span class="idl">${x.e.id}</span></span>${solvePill(x.e.solve)}<span class="mono small">${x.e.date}</span></div>`).join('')}</div>` : ''}
  </div>`;
}
function renderSimSide(bf) {
  let found = null;
  for (const e of MODELS) if (e === SIM.sel) found = e;
  let html = '<div class="dp">';
  if (found) {
    const e = found, o = feat(e), b = bf, s = score(b, o);
    const row = (k, a, c, dif) => `<tr><th>${k}</th><td>${a}</td><td class="${dif ? 'dif' : ''}">${c}</td></tr>`;
    html += `<h2 style="font-size:15px">${rowChip(e.row)} ${esc(shortTitle(e))}</h2><div class="small" style="color:var(--n-600);margin-bottom:10px">${e.id} · ${e.by} · ${e.date}</div>
      <div class="twin"><div><canvas id="twA" aria-hidden="true"></canvas><div class="cap">기준</div></div><div><canvas id="twB" aria-hidden="true"></canvas><div class="cap">선례 ${e.id}</div></div></div>
      <table class="cmpt" style="margin-top:10px"><tr><th></th><td class="small" style="color:var(--n-600)">기준</td><td class="small" style="color:var(--n-600)">선례 (다른 값은 주황)</td></tr>
      ${row('크기', sizeTxt(b), sizeTxt(o), s.raw.size < .6)}
      ${row('요소', fmt(b.elems), fmt(o.elems), s.raw.scale < .5)}
      ${row('평균 요소', fmt(b.meanElem) + ' mm', fmt(o.meanElem) + ' mm', Math.abs(Math.log(b.meanElem / o.meanElem)) > .4)}
      ${row('구역', b.zone || '모름', o.zone, b.zone && b.zone !== o.zone)}
      ${row('해석 종류', b.atype || '모름', o.atype, b.atype && b.atype !== o.atype)}
      ${row('검증', '—', e.solve === 'pass' ? '통과' : e.solve === 'fail' ? '실패' : '검증 전', e.solve === 'fail')}</table>
      <p class="sec-t" style="margin-top:12px">단면 · 같은 것 ${s.inter.length}개</p><div class="secs">${[...new Set([...b.secs, ...o.secs])].sort().map(x => `<span class="${s.inter.includes(x) ? 'hit' : ''}">${esc(x)}${s.inter.includes(x) ? '' : (b.secs.includes(x) ? ' <i>기준만</i>' : ' <i>선례만</i>')}</span>`).join('')}</div>
      <p class="sec-t" style="margin-top:14px">문서</p>${e.reports.length ? e.reports.map(r => `<div style="display:flex;gap:6px;align-items:center;padding:3px 0"><span class="kb ${r.k}">${r.k === 'pdf' ? 'PDF' : 'PPTX'}</span><span class="small">${esc(r.n)}</span></div>`).join('') : '<p class="small" style="color:var(--n-600)">이 선례에는 문서가 없습니다. 올린 사람에게 결과를 물어보세요.</p>'}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><button class="btn primary">나란히 비교</button>${s.shape ? '<button class="btn">바뀐 곳 3D로 보기</button>' : ''}${e.reports.length ? '<button class="btn">문서 근거로 요약</button>' : ''}<button class="btn ghost">자료 열기</button></div>
      <p class="sec-t" style="margin-top:16px">닮은 정도 ${s.total.toFixed(2)}${s.shape ? ' · 형상이 같아 맨 위' : ''}</p>
      <div class="parts">${Object.keys(PART_NAMES).map(k => `<div class="prow"><span>${PART_NAMES[k]}</span><span class="tr"><i style="width:${Math.round(s.raw[k] * 100)}%"></i></span><span class="num">${s.raw[k].toFixed(2)}</span></div>`).join('')}</div>`;
  }
  html += `<details class="adm"><summary>점수 무게 조정 (관리자 · 시안 확인용)</summary>
    ${Object.keys(PART_NAMES).map(k => `<div class="wrow"><label for="w_${k}">${PART_NAMES[k]}</label><input type="range" id="w_${k}" min="0" max="0.6" step="0.05" value="${SIM.w[k]}" data-w="${k}"><span class="mono small">${SIM.w[k].toFixed(2)}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px"><span class="small" style="color:var(--n-600)">형상이 같으면 무게와 상관없이 맨 위입니다.</span><button class="btn ghost" id="wReset">처음 값</button></div></details></div>`;
  return html;
}
function bindSimilar(bf, shown) {
  drawModel(document.getElementById('baseCv'), SIM.base.geom, { pad: 12, label: sizeLabel(SIM.base.geom) });
  main.querySelectorAll('[data-cv]').forEach(cv => { const g = MODELS.find(e => e.id === cv.dataset.cv).geom; drawModel(cv, g, { pad: 8, label: sizeLabel(g) }); });
  const side = () => { const e = SIM.sel; if (!e || !document.getElementById('twA')) return; drawModel(document.getElementById('twA'), SIM.base.geom, { pad: 10, label: sizeLabel(SIM.base.geom) }); drawModel(document.getElementById('twB'), e.geom, { pad: 10, label: sizeLabel(e.geom) }); };
  const bindSide = () => {
    main.querySelectorAll('[data-w]').forEach(inp => inp.oninput = () => { SIM.w[inp.dataset.w] = +inp.value; keepOpen(); });
    const rs = document.getElementById('wReset'); if (rs) rs.onclick = () => { SIM.w = { ...W0 }; keepOpen(); };
  };
  const keepOpen = () => { keepScroll(renderSimilar); const d = main.querySelector('details.adm'); if (d) d.open = true; };
  side(); bindSide();
  const items = [...main.querySelectorAll('.res')];
  const pickIt = (el, focus) => { SIM.sel = MODELS.find(e => e.id === el.dataset.id); items.forEach(x => { x.setAttribute('aria-selected', x === el); x.tabIndex = x === el ? 0 : -1; }); document.getElementById('simSide').innerHTML = renderSimSide(bf); side(); bindSide(); if (focus) el.focus(); };
  items.forEach((el, i) => {
    el.onclick = ev => { if (ev.target.closest('[data-grp]')) return; pickIt(el); };
    el.onkeydown = ev => { if (ev.key === 'ArrowDown' && items[i + 1]) { ev.preventDefault(); pickIt(items[i + 1], true); } if (ev.key === 'ArrowUp' && items[i - 1]) { ev.preventDefault(); pickIt(items[i - 1], true); } if (ev.key === 'Enter') pickIt(el); };
  });
  main.querySelectorAll('[data-grp]').forEach(btn => btn.onclick = () => { const k = btn.dataset.grp; SIM.open.has(k) ? SIM.open.delete(k) : SIM.open.add(k); keepScroll(renderSimilar); });
  main.querySelectorAll('[data-ord]').forEach(btn => btn.onclick = () => { SIM.order = btn.dataset.ord; keepScroll(renderSimilar); });
  main.querySelectorAll('[data-ex]').forEach(btn => btn.onclick = () => { setBase(EXAMPLES[+btn.dataset.ex]); renderSimilar(); });
  const gc = document.getElementById('goCov'); if (gc) gc.onclick = () => { history.replaceState(null, '', '#coverage'); go('coverage'); };
  document.getElementById('fromEntry').onchange = ev => { const e = MODELS.find(x => x.id === ev.target.value); if (!e) return; setBase({ name: e.title.replace(/ · /g, '_') + '.bdf', f: feat(e), geom: e.geom, entry: e }); renderSimilar(); };
  document.getElementById('zSel').onchange = ev => { SIM.zone = ev.target.value; keepScroll(renderSimilar); };
  document.getElementById('aSel').onchange = ev => { SIM.atype = ev.target.value; keepScroll(renderSimilar); };
  const fi = document.getElementById('fileIn'); document.getElementById('pickFile').onclick = () => fi.click(); fi.onchange = () => fi.files[0] && readBdf(fi.files[0]);
  const dz = document.getElementById('drop');
  dz.ondragover = ev => { ev.preventDefault(); dz.classList.add('over'); }; dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = ev => { ev.preventDefault(); dz.classList.remove('over'); const f = ev.dataTransfer.files[0]; if (f) readBdf(f); };
}

/* 브라우저에서 BDF 간단히 읽기(시안용 — 실제는 서버 bdf/features.py). 소형·대형·자유 필드 GRID/요소/PSHELL/PBEAML 만 */
function readBdf(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const txt = String(rd.result); const lines = txt.split(/\r?\n/);
      const cnt = { beam: 0, shell: 0, rigid: 0, mass: 0 }; const xs = [], ys = [], zs = []; const secs = new Set(); let sol = null;
      const fields = (ln) => {
        if (ln.includes(',')) return ln.split(',').map(s => s.trim());
        const big = /^\S+\*/.test(ln); const w = big ? 16 : 8; const out = [ln.slice(0, 8).trim()];
        for (let p = 8; p < Math.min(ln.length, big ? 72 : 72); p += w) out.push(ln.slice(p, p + w).trim());
        return out;
      };
      const num = s => { if (!s) return NaN; s = s.replace(/^([+-]?[\d.]+)([+-]\d+)$/, '$1e$2'); return parseFloat(s); };
      for (let i = 0; i < lines.length; i++) {
        const ln = lines[i]; if (!ln || ln[0] === '$') continue;
        const head = ln.slice(0, 8).split(/[,\s*]/)[0].toUpperCase();
        if (/^SOL\s/i.test(ln)) sol = ln.split(/\s+/)[1];
        if (head === 'GRID') { const f = fields(ln); let x = num(f[3]), y = num(f[4]), z = num(f[5]); if (/^GRID\*/i.test(ln) && lines[i + 1]) { z = num(fields(lines[i + 1])[1]); } if (isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); zs.push(isFinite(z) ? z : 0); } }
        else if (/^(CBAR|CBEAM|CROD|CONROD|CBUSH)$/.test(head)) cnt.beam++;
        else if (/^(CQUAD4|CQUAD8|CTRIA3|CTRIA6|CQUADR|CTRIAR)$/.test(head)) cnt.shell++;
        else if (/^(RBE2|RBE3|RBAR)$/.test(head)) cnt.rigid++;
        else if (/^CONM/.test(head)) cnt.mass++;
        else if (head === 'PSHELL') { const t = num(fields(ln)[3]); if (isFinite(t)) secs.add('t' + (+t.toFixed(1))); }
        else if (head === 'PBEAML' || head === 'PBARL') { const f = fields(ln); const ty = (f[4] || '').toUpperCase(); const nx = lines[i + 1] ? fields(lines[i + 1]).slice(1).map(num).filter(isFinite) : []; const pre = { L: 'L', H: 'H', I: 'H', T: 'T', TUBE: 'PIPE', BOX: 'BOX', BAR: 'FB', ROD: 'ROD' }[ty] || ty; if (pre && nx.length) secs.add(pre + nx.slice(0, 4).map(v => +v.toFixed(1)).join('x')); }
      }
      const elems = cnt.beam + cnt.shell;
      if (!xs.length || !elems) throw new Error('GRID나 요소를 찾지 못했습니다');
      const span = a => { let lo = Infinity, hi = -Infinity; for (const v of a) { if (v < lo) lo = v; if (v > hi) hi = v; } return hi - lo; };
      let d = [span(xs), span(ys), span(zs)]; const big = Math.max(...d); const toM = big > 500 ? 1 / 1000 : 1; d = d.map(v => +(v * toM).toFixed(1));
      const tot = cnt.beam + cnt.shell + cnt.rigid + cnt.mass;
      const mix = [cnt.beam, cnt.shell, cnt.rigid, cnt.mass].map(v => v / tot);
      const meanElem = Math.round(Math.hypot(...d) * 1000 / Math.sqrt(elems) * 2.2);
      const kind = mix[1] > .5 ? (d[2] > 5 ? 'module' : 'plate') : (d[2] > Math.max(d[0], d[1]) * 2 ? 'mast' : d[2] > 5 ? 'module' : 'frame');
      setBase({ name: file.name, parsed: true, f: { L: d[0], W: d[1], H: d[2], elems, meanElem, mix, secs: [...secs].sort().slice(0, 30), sig: 'file', zone: '', atype: '', sol }, geom: { kind, L: Math.max(d[0], .5), W: Math.max(d[1], .5), H: Math.max(d[2], .3), nx: 5, ny: 3, decks: 3, seed: 3 } });
      renderSimilar();
    } catch (err) {
      SIM.err = `${file.name}을(를) 읽지 못했습니다. ${err.message}. GRID와 요소 카드가 있는 BDF인지 확인하세요.`; keepScroll(renderSimilar);
    }
  };
  rd.readAsText(file);
}

/* ================= 화면 전환 ================= */
const ROUTES = { coverage: renderCoverage, checks: renderChecks, similar: renderSimilar };
function go(r) {
  if (!ROUTES[r]) r = 'coverage';
  cancelAnimationFrame(CK.raf); hideTip();
  document.querySelectorAll('[data-route]').forEach(b => b.toggleAttribute('aria-current', b.dataset.route === r) || b.dataset.route === r && b.setAttribute('aria-current', 'page'));
  document.querySelectorAll('[data-route]').forEach(b => b.dataset.route === r ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  main.scrollTop = 0; ROUTES[r]();
  try { localStorage.setItem('lb-insight-route', r); } catch (e) { }
}
document.querySelectorAll('[data-route]').forEach(b => b.onclick = () => { history.replaceState(null, '', '#' + b.dataset.route); go(b.dataset.route); });
let start = location.hash.slice(1);
if (!ROUTES[start]) { try { start = localStorage.getItem('lb-insight-route') || 'coverage'; } catch (e) { start = 'coverage'; } }
go(start);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ROUTES[h]) go(h); });
addEventListener('resize', () => { const r = (document.querySelector('[data-route][aria-current]') || {}).dataset; if (r && r.route !== 'coverage') keepScroll(ROUTES[r.route]); });
</script>

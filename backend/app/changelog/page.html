<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogBook 업데이트 이력</title>
<link rel="icon" href="/favicon.png">
<!-- 46 — 개선·업데이트 이력(LV3). 내용은 /api/admin/updates(app/changelog/changelog.json). 외부 파일 없이 한 장 -->
<style>
  :root {
    --n-0: #FFFFFF; --n-50: #F5F8FD; --n-100: #EEF2F8; --n-200: #E0E5EC; --n-500: #686D74; --n-600: #4E5359;
    --n-700: #383C42; --n-900: #13171C; --navy-900: #002554; --navy-700: #1B3E6E; --on-navy-muted: #B9C9DE;
    --mint: #6BE8C1; --brand-subtle: #EDF3FB; --ok: #007A30; --ok-bg: #EAF5EE; --wait: #A34A07; --wait-bg: #FDF3E7;
    --err: #B42318; --err-bg: #FDEEEC; --violet: #5B3FB5; --violet-bg: #F1EDFB; --gray-bg: #EEF2F8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--n-50); color: var(--n-900);
         font: 14px/1.55 "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  header { background: var(--navy-900); color: #fff; }
  .bar { max-width: 880px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .mark { font-weight: 700; letter-spacing: -0.01em; }
  .mark b { color: var(--mint); font-weight: 700; }
  .bar .sub { color: var(--on-navy-muted); font-size: 13px; }
  .bar a { margin-left: auto; color: var(--on-navy-muted); font-size: 13px; text-decoration: none; }
  .bar a:hover { color: #fff; text-decoration: underline; }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 16px; color: var(--n-600); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .tools input { flex: 1 1 220px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--n-200);
                 border-radius: 6px; background: var(--n-0); font: inherit; }
  .tools input:focus { outline: 2px solid #7F97B8; outline-offset: 0; border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { height: 30px; padding: 0 10px; border: 1px solid var(--n-200); border-radius: 999px; background: var(--n-0);
          color: var(--n-700); font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }
  .count { color: var(--n-500); font-size: 13px; margin-left: auto; }
  section { margin-top: 20px; }
  h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--n-600); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--n-0); border: 1px solid var(--n-200); border-radius: 8px; }
  li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 12px; padding: 12px 14px;
       border-bottom: 1px solid var(--n-100); }
  li:last-child { border-bottom: 0; }
  .date { color: var(--n-500); font-size: 13px; padding-top: 1px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .title { font-weight: 600; }
  .no { color: var(--n-500); font-size: 12px; }
  .badge { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 12px; line-height: 20px; font-weight: 500; }
  .k-기능 { background: var(--brand-subtle); color: var(--navy-900); }
  .k-개선 { background: var(--ok-bg); color: var(--ok); }
  .k-정리 { background: var(--gray-bg); color: var(--n-600); }
  .k-운영 { background: var(--violet-bg); color: var(--violet); }
  .k-검토 { background: var(--wait-bg); color: var(--wait); }
  .status { background: var(--wait-bg); color: var(--wait); }
  .summary { grid-column: 2; margin: 0; color: var(--n-700); }
  .note { padding: 16px; border-radius: 8px; background: var(--n-0); border: 1px solid var(--n-200); color: var(--n-700); }
  .note.err { background: var(--err-bg); border-color: #F4C7C1; color: var(--err); }
  .note a { color: var(--navy-900); font-weight: 600; }
  mark { background: #FFF1B8; color: inherit; padding: 0 1px; border-radius: 2px; }
  @media (max-width: 560px) {
    li { grid-template-columns: minmax(0, 1fr); }
    .summary { grid-column: 1; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="mark">Hi-TESS <b>LogBook</b></span>
    <span class="sub">개선·업데이트 이력</span>
    <a href="/">LogBook 열기 →</a>
  </div>
</header>
<main>
  <h1>개선·업데이트 이력</h1>
  <p class="lead">LogBook 에 무엇이 언제 더해지고 바뀌었는지. 최근 것부터.</p>
  <div id="app"><p class="note">불러오는 중…</p></div>
</main>
<script>
(function () {
  'use strict';
  var KINDS = ['전체', '기능', '개선', '정리', '운영', '검토'];
  var app = document.getElementById('app');
  var state = { items: [], kind: '전체', q: '' };

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // 검색어가 든 부분을 <mark> 로(글자는 textContent 로만 넣는다)
  function marked(text, q) {
    var span = el('span');
    var low = text.toLowerCase(), at = 0, i;
    if (!q) { span.textContent = text; return span; }
    while ((i = low.indexOf(q, at)) !== -1) {
      span.appendChild(document.createTextNode(text.slice(at, i)));
      span.appendChild(el('mark', { text: text.slice(i, i + q.length) }));
      at = i + q.length;
    }
    span.appendChild(document.createTextNode(text.slice(at)));
    return span;
  }

  function note(html, err) {
    app.innerHTML = '';
    var p = el('p', { class: 'note' + (err ? ' err' : '') });
    p.innerHTML = html;   // 아래 고정 문구만 넣는다
    app.appendChild(p);
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return state.items.filter(function (it) {
      if (state.kind !== '전체' && it.kind !== state.kind) return false;
      if (!q) return true;
      return [it.title, it.summary, it.no, it.status, it.date].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderList(box, count) {
    var rows = filtered(), q = state.q.trim().toLowerCase();
    count.textContent = rows.length + '건';
    box.innerHTML = '';
    if (!rows.length) { box.appendChild(el('p', { class: 'note', text: '맞는 항목이 없습니다.' })); return; }
    var months = {}, order = [];
    rows.forEach(function (it) {
      var m = (it.date || '').slice(0, 7) || '날짜 없음';
      if (!months[m]) { months[m] = []; order.push(m); }
      months[m].push(it);
    });
    order.forEach(function (m) {
      var parts = m.split('-');
      var label = parts.length === 2 ? parts[0] + '년 ' + Number(parts[1]) + '월' : m;
      var ul = el('ul');
      months[m].forEach(function (it) {
        var head = el('div', { class: 'head' }, [
          el('span', { class: 'badge k-' + it.kind, text: it.kind }),
          el('span', { class: 'title' }, [marked(it.title || '', q)]),
          it.no ? el('span', { class: 'no mono', text: '#' + it.no }) : null,
          it.status ? el('span', { class: 'badge status', text: it.status }) : null,
        ]);
        ul.appendChild(el('li', {}, [
          el('span', { class: 'date mono', text: it.date || '' }),
          head,
          it.summary ? el('p', { class: 'summary' }, [marked(it.summary, q)]) : null,
        ]));
      });
      box.appendChild(el('section', {}, [el('h2', { text: label }), ul]));
    });
  }

  function render() {
    app.innerHTML = '';
    var input = el('input', { type: 'search', placeholder: '찾기 — 제목·설명·번호', 'aria-label': '이력 찾기' });
    var count = el('span', { class: 'count' });
    var chips = el('div', { class: 'chips', role: 'group', 'aria-label': '분류' });
    var box = el('div');
    KINDS.forEach(function (k) {
      var b = el('button', { type: 'button', class: 'chip', 'aria-pressed': String(k === state.kind), text: k });
      b.addEventListener('click', function () {
        state.kind = k;
        Array.prototype.forEach.call(chips.children, function (c) { c.setAttribute('aria-pressed', String(c.textContent === k)); });
        renderList(box, count);
      });
      chips.appendChild(b);
    });
    input.addEventListener('input', function () { state.q = input.value; renderList(box, count); });
    app.appendChild(el('div', { class: 'tools' }, [input, chips, count]));
    app.appendChild(box);
    renderList(box, count);
  }

  var token = '';
  try { token = localStorage.getItem('logbook_token') || ''; } catch (e) { token = ''; }
  if (!token) {
    note('LogBook 에 로그인한 관리자(LV3)만 볼 수 있습니다. <a href="/login">로그인</a>한 뒤 이 주소(<span class="mono">/updates</span>)를 다시 여세요.');
    return;
  }
  fetch('/api/admin/updates', { headers: { Authorization: 'Bearer ' + token } })
    .then(function (res) {
      if (res.status === 401) throw { msg: '로그인이 끝났습니다. <a href="/login">다시 로그인</a>한 뒤 이 주소를 다시 여세요.' };
      if (res.status === 403) throw { msg: '관리자(LV3)만 볼 수 있습니다.' };
      if (res.status === 503) throw { msg: 'WorkBench 사용자 표에 연결하지 못해 확인할 수 없습니다. 잠시 뒤 다시 여세요.' };
      if (!res.ok) throw { msg: '이력을 불러오지 못했습니다(' + res.status + ').' };
      return res.json();
    })
    .then(function (data) { state.items = data.items || []; render(); })
    .catch(function (e) { note(e && e.msg ? e.msg : '이력을 불러오지 못했습니다.', true); });
})();
</script>
</body>
</html>
